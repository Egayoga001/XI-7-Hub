name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper & Build APK
      run: |
        # Jika file gradlew tidak ada, buat secara otomatis menggunakan perintah gradle
        if [ ! -f "./gradlew" ]; then
          echo "Membuat Gradle Wrapper secara otomatis..."
          gradle wrapper
        fi

        # Beri izin eksekusi
        chmod +x ./gradlew

        # Jalankan proses build APK
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
